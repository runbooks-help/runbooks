name: Docs site

# The public docs site is a derived image: the runtime plus a build-time seed of
# runbooks-help/runbooks-docs. It is not a release artifact (the official image
# ships no content); Cloudflare Containers deploy it. See
# specs/runbooks/docs-hosting/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          DATETIME=$(date -u '+%Y%m%d%H%M%S')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "value=ghcr.io/runbooks-help/runbooks-docs-site:main-${DATETIME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: docs
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.tag.outputs.value }}
            ghcr.io/runbooks-help/runbooks-docs-site:latest
          build-args: |
            VERSION=docs
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
