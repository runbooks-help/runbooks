name: Container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach the SBOMs
      packages: write
      id-token: write   # cosign keyless attestation

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tags
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          DATETIME=$(date -u '+%Y%m%d%H%M%S')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=ghcr.io/ladydascalie/runbooks:${BRANCH}-${DATETIME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag is a release: stamp the version and give it a clean tag.
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "extra=ghcr.io/ladydascalie/runbooks:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            echo "extra=ghcr.io/ladydascalie/runbooks:latest" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.extra }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tag.outputs.value }}
          format: spdx-json
          output-file: sbom/runbooks.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tag.outputs.value }}
          format: cyclonedx-json
          output-file: sbom/runbooks.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Sign the release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${{ steps.tag.outputs.value }}"

      - name: Attest SBOM against the release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign attest --yes \
            --predicate sbom/runbooks.spdx.json \
            --type spdxjson \
            "${{ steps.tag.outputs.value }}"

      - name: Publish release with the SBOMs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Container image: ghcr.io/ladydascalie/runbooks@${IMAGE_DIGEST}

          Attached: the SPDX 2.3 and CycloneDX SBOMs for that exact image.
          See docs/internals/sbom.md for the cosign verification steps.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" sbom/runbooks.spdx.json sbom/runbooks.cdx.json --clobber
