name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate templ components
        run: go tool templ generate ./...

      - name: Fetch the design system
        run: go run ./cmd/designsystem

      - name: Build CSS and JS bundles
        run: |
          go run ./cmd/css
          go run ./cmd/js

      - name: Verify bundles were generated
        run: test -s public/css/bundle.css && test -s public/js/bundle.js

      - name: Verify bundles are not committed
        run: '! git ls-files --error-unmatch public/css/bundle.css public/js/bundle.js'

      - name: Verify third-party notices are up to date
        run: |
          go run ./cmd/notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Verify SPDX headers
        run: go run ./cmd/spdx

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: JS unit tests
        run: node --test public/js/src/*.test.mjs
