[tools]
go = "latest"
"aqua:a-h/templ" = "latest"
gofumpt = "latest"
node = "latest"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "latest"

[env]
PORT = "8091"
# Git sync dev config (see ~/openspec/plans/specs/runbook-notes-git-sync.md).
# Uses the SSH key rather than a token so no secret lives in this tracked file;
# GITSYNC_API_TOKEN is a local-dev shared secret the browser prompts for on Sync.
GITSYNC_REPO = "git@github.com:ladydascalie/runbooks-sync-test.git"
GITSYNC_BRANCH = "main"
GITSYNC_BASE_PATH = "runs"
GITSYNC_AUTHOR_NAME = "Runbooks Sync Bot"
GITSYNC_AUTHOR_EMAIL = "cable.benjamin@protonmail.com"
GITSYNC_SSH_KEY = "~/.ssh/personal"
GITSYNC_API_TOKEN = "dev-local-bearer"

[tasks.generate]
description = "Run templ code generation"
run = "templ generate ./..."

[tasks.css]
description = "Compile CSS bundle (one-shot)"
run = "go run ./cmd/css"

[tasks.js]
description = "Compile JS bundles (one-shot)"
run = "go run ./cmd/js"

[tasks.build]
description = "Generate templ components, compile CSS + JS, and build binary"
depends = ["generate", "css", "js"]
run = "go build -o runbooks ."

[tasks.dev]
description = "Live-reload dev server (templ watch + CSS/JS watch + air)"
depends = ["css", "js"]
run = """
  templ generate --watch ./... & TEMPL_PID=$!
  go run ./cmd/css --watch & CSS_PID=$!
  go run ./cmd/js --watch & JS_PID=$!
  trap "kill $CSS_PID $JS_PID $TEMPL_PID 2>/dev/null" EXIT
  air -c .air.toml
"""

[tasks.lintcss]
description = "Lint CSS source files"
run = "npx stylelint 'public/css/src/**/*.css'"

[tasks.fmtcss]
description = "Format CSS source files with Prettier"
run = "npx prettier --write 'public/css/src/**/*.css'"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:sqlite"]
description = "Run the SQLite store against a local on-disk database"
run = "mkdir -p tmp && STORES_SQLITE_DSN=\"file:$PWD/tmp/stores.db\" go test -run TestLocalDB -v ./stores/sqlite/"

[tasks."test:mysql"]
description = "Run the store contract against the local MySQL from compose.yaml"
run = """
  podman compose up -d --wait mysql
  STORES_MYSQL_DSN="root:root@tcp(127.0.0.1:3307)/runbooks_identity" go test -v ./stores/mysql/
"""

[tasks."test:postgres"]
description = "Run the store contract against the local PostgreSQL from compose.yaml"
run = """
  podman compose up -d --wait postgres
  STORES_POSTGRES_DSN="postgres://postgres:postgres@127.0.0.1:5433/runbooks_identity?sslmode=disable" go test -v ./stores/postgres/
"""

[tasks."test:mutation"]
description = "Mutation-test the SQLite store and the identity service (fast, no database)"
run = """
  gremlins unleash ./stores/sqlite
  gremlins unleash ./identity
"""

[tasks."test:mutation:all"]
description = "Mutation-test every package with a contract (starts the compose databases)"
run = """
  podman compose up -d --wait mysql postgres
  gremlins unleash ./stores/sqlite
  gremlins unleash ./identity
  # The database-backed stores share one database, so the mutants must run
  # serially — parallel runs would race on the tables they reset.
  STORES_MYSQL_DSN="root:root@tcp(127.0.0.1:3307)/runbooks_identity" gremlins unleash --workers 1 ./stores/mysql
  STORES_POSTGRES_DSN="postgres://postgres:postgres@127.0.0.1:5433/runbooks_identity?sslmode=disable" gremlins unleash --workers 1 ./stores/postgres
"""

[tasks."db:down"]
description = "Stop the local test databases"
run = "podman compose down -v"
