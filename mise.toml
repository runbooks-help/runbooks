[tools]
go = "latest"
"aqua:a-h/templ" = "latest"
"aqua:anchore/syft" = "latest"
gofumpt = "latest"
node = "latest"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "latest"

[env]
PORT = "8091"
# Git sync dev config (see ~/openspec/plans/specs/runbooks/notes-git-sync/README.md).
# Uses the SSH key rather than a token so no secret lives in this tracked file;
# GITSYNC_API_TOKEN is a local-dev shared secret the browser prompts for on Sync.
GITSYNC_REPO = "git@github.com:ladydascalie/runbooks-sync-test.git"
GITSYNC_BRANCH = "main"
GITSYNC_BASE_PATH = "runs"
GITSYNC_AUTHOR_NAME = "Runbooks Sync Bot"
GITSYNC_AUTHOR_EMAIL = "cable.benjamin@protonmail.com"
GITSYNC_SSH_KEY = "~/.ssh/personal"
GITSYNC_API_TOKEN = "dev-local-bearer"

# Identity dev config (see ~/openspec/plans/specs/runbooks/identity/README.md).
# An empty driver leaves the app PUBLIC (no passkeys, no gating) — used to share
# the dev UI for feedback. To exercise passkeys again, set the driver to sqlite and
# uncomment the rest: open http://localhost:8091/setup and paste the bootstrap token.
# IDENTITY_DB_DRIVER = ""
IDENTITY_DB_DRIVER = "sqlite"
IDENTITY_DB_DSN = "file:./tmp/identity.db"
IDENTITY_PUBLIC_URL = "http://localhost:8091"
IDENTITY_BOOTSTRAP_TOKEN = "dev-bootstrap-token"
IDENTITY_SECURE_COOKIES = "false"

# The design-system styleguide is a dev-only surface (see specs/runbooks/design-system/README.md).
STYLEGUIDE_ENABLED = "true"

[tasks.generate]
description = "Run templ code generation"
run = "templ generate ./..."

[tasks.css]
description = "Compile CSS bundle (one-shot)"
run = "go run ./cmd/css"

[tasks.js]
description = "Compile JS bundles (one-shot)"
run = "go run ./cmd/js"

[tasks.build]
description = "Generate templ components, compile CSS + JS, and build binary"
depends = ["generate", "css", "js"]
run = "go build -ldflags \"-X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o runbooks ."

[tasks.dev]
description = "Live-reload dev server (templ watch + CSS/JS watch + air)"
depends = ["css", "js"]
run = """
  templ generate --watch ./... & TEMPL_PID=$!
  go run ./cmd/css --watch & CSS_PID=$!
  go run ./cmd/js --watch & JS_PID=$!
  trap "kill $CSS_PID $JS_PID $TEMPL_PID 2>/dev/null" EXIT
  air -c .air.toml
"""

[tasks.lintcss]
description = "Lint CSS source files"
run = "npx stylelint 'public/css/src/**/*.css'"

[tasks.fmtcss]
description = "Format CSS source files with Prettier"
run = "npx prettier --write 'public/css/src/**/*.css'"

[tasks.slop]
description = "Run slop (code generation)"
run = "npx aislop scan --exclude \"public/js/vendor,public/js/bundle.js\""

[tasks.test]
description = "Run Go and JS tests"
depends = ["generate"]
run = """
  go test ./...
  node --test public/js/src/*.test.mjs
"""

[tasks."test:js"]
description = "Run JS unit tests"
run = "node --test public/js/src/*.test.mjs"

[tasks."test:e2e"]
description = "Browser E2E: real WebAuthn ceremony (CDP virtual authenticator) against a throwaway instance"
depends = ["build"]
run = "npm --prefix e2e install --silent && node --test e2e/"

[tasks."test:e2e:headed"]
description = "Browser E2E with a visible window (E2E_SLOWMO to pace it); close the window to finish"
depends = ["build"]
run = "npm --prefix e2e install --silent && E2E_HEADED=1 E2E_SLOWMO=${E2E_SLOWMO:-600} node --test e2e/"

[tasks."test:e2e:inspect"]
description = "Browser E2E in headed mode with the Playwright Inspector (page.pause breakpoints; step over / resume)"
depends = ["build"]
run = "npm --prefix e2e install --silent && E2E_INSPECT=1 node --test e2e/"

[tasks."test:fuzz"]
description = "Run a bounded fuzzing round (Go fuzz targets + JS differential fuzz)"
run = """
  go test -run=^$ -fuzz=FuzzTransportsRoundTrip -fuzztime=20s ./stores/
  go test -run=^$ -fuzz=FuzzNullStringRoundTrip -fuzztime=20s ./internal/nullable/
  go test -run=^$ -fuzz=FuzzNullJSONUnmarshal -fuzztime=15s ./internal/nullable/
  go test -run=^$ -fuzz=FuzzAuthenticateNeverPanics -fuzztime=15s ./identity/
  go test -run=^$ -fuzz=FuzzFinishRegistrationNeverPanics -fuzztime=20s ./identity/
  go test -run=^$ -fuzz=FuzzFinishLoginNeverPanics -fuzztime=20s ./identity/
  go test -run=^$ -fuzz=FuzzHashTokenDeterministic -fuzztime=15s ./identity/
  FUZZ_ITERATIONS=300000 node --test public/js/src/base64url.fuzz.test.mjs
"""

[tasks."test:sqlite"]
description = "Run the SQLite store against a local on-disk database"
run = "mkdir -p tmp && STORES_SQLITE_DSN=\"file:$PWD/tmp/stores.db\" go test -run TestLocalDB -v ./stores/sqlite/"

[tasks."test:mysql"]
description = "Run the store contract against the local MySQL from compose.yaml"
run = """
  podman compose up -d --wait mysql
  STORES_MYSQL_DSN="root:root@tcp(127.0.0.1:3307)/runbooks_identity" go test -v ./stores/mysql/
"""

[tasks."test:postgres"]
description = "Run the store contract against the local PostgreSQL from compose.yaml"
run = """
  podman compose up -d --wait postgres
  STORES_POSTGRES_DSN="postgres://postgres:postgres@127.0.0.1:5433/runbooks_identity?sslmode=disable" go test -v ./stores/postgres/
"""

[tasks."test:mutation"]
description = "Mutation-test the SQLite store, the identity service, the git/content sources and the auth HTTP layer (fast, no database)"
run = """
  gremlins unleash ./stores/sqlite
  gremlins unleash ./identity
  gremlins unleash ./contentsource
  gremlins unleash ./internal/gitrepo
  # The auth/admin/recovery HTTP layer is in package main; scope the run to the
  # hand-written handlers so it does not mutate generated views, wiring or
  # git-sync. The styleguide is a dev-only surface, deliberately untested.
  gremlins unleash --exclude-files 'views/|cmd/|parser/|internal/|stores/|identity/|gitsync.go|main.go|config.go|styleguide.go|_test.go' .
"""

[tasks."test:mutation:all"]
description = "Mutation-test every package with a contract (starts the compose databases)"
run = """
  podman compose up -d --wait mysql postgres
  gremlins unleash ./stores/sqlite
  gremlins unleash ./identity
  gremlins unleash ./contentsource
  gremlins unleash ./internal/gitrepo
  # The database-backed stores share one database, so the mutants must run
  # serially — parallel runs would race on the tables they reset.
  STORES_MYSQL_DSN="root:root@tcp(127.0.0.1:3307)/runbooks_identity" gremlins unleash --workers 1 ./stores/mysql
  STORES_POSTGRES_DSN="postgres://postgres:postgres@127.0.0.1:5433/runbooks_identity?sslmode=disable" gremlins unleash --workers 1 ./stores/postgres
"""

[tasks."db:down"]
description = "Stop the local test databases"
run = "podman compose down -v"

[tasks.notices]
description = "Regenerate THIRD_PARTY_NOTICES.md from the linked modules and vendored assets"
run = "go run ./cmd/notices"

[tasks."lint:spdx"]
description = "Verify every authored source file carries the FSL SPDX header (use `go run ./cmd/spdx -fix` to apply)"
run = "go run ./cmd/spdx"

[tasks.sbom]
description = "Generate SPDX + CycloneDX SBOMs for the built binary"
depends = ["build"]
run = """
  mkdir -p sbom
  syft ./runbooks -o spdx-json=sbom/runbooks.spdx.json -o cyclonedx-json=sbom/runbooks.cdx.json
  echo "wrote sbom/runbooks.spdx.json, sbom/runbooks.cdx.json"
"""

[tasks."sbom:image"]
description = "Build the container image and generate SPDX + CycloneDX SBOMs for it"
run = """
  podman build -t runbooks:sbom .
  mkdir -p sbom
  syft runbooks:sbom -o spdx-json=sbom/runbooks-image.spdx.json -o cyclonedx-json=sbom/runbooks-image.cdx.json
  echo "wrote sbom/runbooks-image.spdx.json, sbom/runbooks-image.cdx.json"
"""
