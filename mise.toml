[tools]
go = "latest"
"aqua:a-h/templ" = "latest"
"aqua:anchore/syft" = "latest"
gofumpt = "latest"
node = "latest"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "latest"

[env]
PORT = "8091"
# Personal/secret dev values (the notes repo, commit identity, GITSYNC_API_TOKEN,
# …) load from the git-ignored .env; copy .env.example and fill it in. SSH
# remotes otherwise use the ambient SSH agent, so no key is needed locally.
# Values set explicitly below win over the file.
_.file = ".env"

# Git sync dev config (see the configuration reference at
# https://docs.runbooks.help/configuration).
# The repo, commit identity and credential live in .env; only the structural
# defaults are tracked here.
GITSYNC_BRANCH = "main"
GITSYNC_BASE_PATH = "runs"

# Identity dev config (see https://docs.runbooks.help/identity).
# An empty driver leaves the app PUBLIC (no passkeys, no gating); used to share
# the dev UI for feedback. To exercise passkeys again, set the driver to sqlite and
# uncomment the rest: open http://localhost:8091/setup and paste the bootstrap token.
# IDENTITY_DB_DRIVER = ""
IDENTITY_DB_DRIVER = "sqlite"
IDENTITY_DB_DSN = "file:./tmp/identity.db"
IDENTITY_PUBLIC_URL = "http://localhost:8091"
IDENTITY_BOOTSTRAP_TOKEN = "dev-bootstrap-token"
IDENTITY_SECURE_COOKIES = "false"

# The design-system styleguide is a dev-only surface.
STYLEGUIDE_ENABLED = "true"
